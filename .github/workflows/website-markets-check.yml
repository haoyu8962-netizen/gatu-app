name: Website Market Snapshot

# The website builds from a committed market snapshot (apps/website/src/data/market-structure.json).
# This read-only check compares it and the market configs with Hyperliquid's public API once a day, so
# a delisted or recategorized featured market, a new deployer or a snapshot older than 7 days shows up
# before the next release. It never writes the snapshot: a refresh is a reviewed commit.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markets:
    name: Check market snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compare the committed snapshot with Hyperliquid
        run: pnpm --filter @sairn/website markets:snapshot --check
