name: Slider Browser Tests

on:
  pull_request:
    paths:
      - ".github/workflows/slider-browser.yml"
      - "apps/terminal/package.json"
      - "apps/terminal/tests/browser/**"
      - "apps/terminal/src/components/trade/components/trade-size-slider.tsx"
      - "packages/ui/src/slider.tsx"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slider-browser:
    name: Slider browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --dir apps/terminal exec playwright install --with-deps chromium

      - name: Run slider browser regression
        run: pnpm --dir apps/terminal test:browser:slider
