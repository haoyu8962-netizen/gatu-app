name: Terminal Browser Tests

on:
  pull_request:
    paths:
      - ".github/workflows/slider-browser.yml"
      - "apps/terminal/package.json"
      - "apps/terminal/tests/browser/**"
      - "apps/terminal/src/**"
      - "packages/ui/src/**"
      - "packages/ui/package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal-browser:
    # Every suite below runs with `--shard`, so each job runs half of each suite.
    # `--fully-parallel` makes Playwright shard by test: by default it shards by file, which
    # leaves one shard with all of the order-entry and account suites and the other with none.
    # The configs keep `workers: 1`, so tests inside a shard still run one at a time.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: Terminal browser regressions (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --dir apps/terminal exec playwright install --with-deps chromium

      # The slider spec stays first and on its own, so the spec that meets the fixture server's
      # cold start is the same one as before sharding, in both shards.
      - name: Run slider browser regression
        run: >-
          pnpm --dir apps/terminal exec playwright test
          tests/browser/trade-size-slider-performance.pw.ts
          --config tests/browser/playwright.config.ts
          --fully-parallel --shard=${{ matrix.shard }}/2

      # One invocation for the other three specs of the shared config, so that the single
      # orderbook CLS test does not leave one shard starting the server for nothing.
      - name: Run orderbook CLS, drawer and orderbook interaction regressions
        run: >-
          pnpm --dir apps/terminal exec playwright test
          tests/browser/mobile-orderbook-cls.pw.ts
          tests/browser/drawer-interactions.pw.ts
          tests/browser/orderbook-hover.pw.ts
          --config tests/browser/playwright.config.ts
          --fully-parallel --shard=${{ matrix.shard }}/2

      - name: Run desktop and mobile order-entry regressions
        run: >-
          pnpm --dir apps/terminal exec playwright test
          --config tests/browser/mobile-trade-all-orders.playwright.config.ts
          --fully-parallel --shard=${{ matrix.shard }}/2

      - name: Run desktop and mobile account funding regressions
        run: >-
          pnpm --dir apps/terminal exec playwright test
          --config tests/browser/account-actions.playwright.config.ts
          --fully-parallel --shard=${{ matrix.shard }}/2
