name: Static Checks

# Type checking, Biome and the translation catalog check each took one to two and a half
# minutes on a runner of their own, most of it checkout and install. They share one job now.
on:
  pull_request:
    paths:
      - ".github/workflows/static-checks.yml"
      - "apps/terminal/**/*.ts"
      - "apps/terminal/**/*.tsx"
      - "apps/terminal/src/locales/**/*.po"
      - "packages/hl-react/**/*.ts"
      - "packages/hl-react/**/*.tsx"
      - "packages/ui/**/*.ts"
      - "packages/ui/**/*.tsx"
      - "package.json"
      - "pnpm-lock.yaml"
      - "**/package.json"
      - "**/tsconfig.json"
      - "tsconfig.base.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Validate TypeScript, lint and translation catalogs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - run: pnpm check

      # The catalog check used to report independently of the type check, so it still runs
      # when an earlier step failed.
      - name: Extract translations
        if: ${{ !cancelled() }}
        run: pnpm i18n:extract

      - name: Check for uncommitted changes
        if: ${{ !cancelled() }}
        run: |
          if ! git diff --quiet apps/terminal/src/locales/**/*.po; then
            echo "::error::Translation catalogs are out of date."
            echo ""
            echo "Run 'pnpm i18n:extract' locally and commit the changes."
            echo ""
            echo "Changed files:"
            git diff --name-only apps/terminal/src/locales/**/*.po
            echo ""
            echo "Diff:"
            git diff apps/terminal/src/locales/**/*.po
            exit 1
          fi
          echo "Translation catalogs are up to date."
