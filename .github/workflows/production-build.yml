name: Production Builds

on:
  pull_request:
    paths:
      - ".github/workflows/production-build.yml"
      - "apps/**"
      - "deploy/**"
      - "designs/og-cards/**"
      - "packages/**"
      - "tests/**"
      - "scripts/validate-mobile-phone-access-device-validation*"
      - "docs/mobile-phone-access-device-validation.md"
      - "scripts/check-client-bundle-budget.mjs"
      - "scripts/check-client-bundle-budget.test.mjs"
      - "scripts/inject-shell-preloads.mjs"
      - "scripts/inject-shell-preloads.test.mjs"
      - "scripts/collect-inline-script-hashes.mjs"
      - "scripts/collect-inline-script-hashes.test.mjs"
      - "scripts/check-client-chunk-cycles.mjs"
      - "scripts/client-chunk-graph.*"
      - "scripts/measure/analyze-client-root-deps.mjs"
      - "scripts/generate-og-cards.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

jobs:
  terminal:
    strategy:
      fail-fast: false
      matrix:
        pairing:
          - { create: "false", import: "false" }
          - { create: "false", import: "true" }
          - { create: "true", import: "false" }
          - { create: "true", import: "true" }
    name: Build terminal (${{ matrix.pairing.create }}/${{ matrix.pairing.import }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test build and release validators
        run: >-
          node --test
          scripts/validate-mobile-phone-access-device-validation.test.js
          scripts/check-client-bundle-budget.test.mjs
          scripts/inject-shell-preloads.test.mjs
          scripts/collect-inline-script-hashes.test.mjs

      - name: Test the CloudFront release tooling
        run: pnpm test:cloudfront

      - name: Test Hyperliquid API resource hints
        working-directory: apps/terminal
        run: >-
          pnpm exec vitest run --maxWorkers=1
          src/lib/tests/seo.test.ts
          src/lib/tests/hyperliquid-resource-hints.test.ts

      - name: Test terminal interaction and mounting contracts
        working-directory: apps/terminal
        run: >-
          pnpm exec vitest run --maxWorkers=1
          src/lib/tests/user-menu.test.tsx
          src/lib/tests/top-nav.test.tsx
          src/lib/tests/wallet-modal.test.tsx
          src/lib/tests/mobile-agent-sync-modal.test.tsx
          src/lib/tests/modal-surface-contract.test.ts
          src/lib/tests/trades.test.ts
          src/lib/tests/orderbook-panel-safety.test.tsx
          src/lib/tests/mobile-bottom-nav.test.tsx
          src/lib/tests/mobile-terminal-market-bar-lifecycle.test.tsx
          src/lib/tests/mobile-terminal-disclosure-state.test.tsx
          src/lib/tests/mobile-trade-layout-market-reset.test.tsx
          src/lib/tests/market-overview.test.tsx

      - name: Test mobile ticket protocol and import lifecycle
        working-directory: apps/terminal
        run: >-
          pnpm exec vitest run --maxWorkers=1
          src/lib/tests/mobile-sync-*.test.ts
          src/lib/tests/mobile-agent-sync-route.test.tsx
          src/lib/tests/mobile-agent-qr-scanner.test.tsx
          src/lib/tests/mobile-pairing-feature-gate.test.ts

      - name: Test route provider lifecycles
        working-directory: apps/terminal
        run: >-
          pnpm exec vitest run --maxWorkers=1
          src/lib/tests/app-route-surface.test.ts
          src/lib/tests/document-title.test.tsx
          src/lib/tests/root-provider-split.test.ts
          src/lib/tests/root-provider-runtime.test.tsx
          src/lib/tests/root-route-transition.test.tsx
          src/lib/tests/application-error-boundary.test.tsx

      - name: Test order draft and exchange session lifecycles
        working-directory: apps/terminal
        run: >-
          pnpm exec vitest run --maxWorkers=1
          src/lib/tests/account-activity-feed-owner.test.tsx
          src/lib/tests/fast-asset-ctxs-subscription.test.tsx
          src/lib/tests/limit-price-prefill-contract.test.ts
          src/lib/tests/mobile-order-safety-contract.test.ts
          src/lib/tests/order-confirmation-gate.test.tsx
          src/lib/tests/order-entry-store.test.tsx
          src/lib/tests/order-slider-sdk-contract.test.tsx
          src/lib/tests/order-submission-wiring.test.ts
          src/lib/tests/order-submit-surface-reset.test.tsx
          src/lib/tests/order-submit-surface-lifecycle-integration.test.tsx
          src/lib/tests/order-submit-twap-details.test.tsx
          src/lib/tests/order-validation.test.ts
          src/lib/tests/provider-address.test.tsx
          src/lib/tests/trade-terminal-page-boot.test.tsx
          src/lib/tests/twap-details.test.ts
          src/lib/tests/use-sub.test.tsx
          src/lib/tests/vite-cache-isolation.test.ts
          tests/mobile-trade-size-validation-a11y.test.tsx
          tests/trade-size-error-a11y.test.tsx

      - name: Test TradingView integration
        working-directory: apps/terminal
        run: >-
          pnpm exec vitest run --maxWorkers=1
          src/lib/tests/chart-*.test.ts
          src/lib/tests/chart-*.test.tsx
          src/lib/tests/load-tradingview.test.ts
          src/lib/tests/mobile-chart-view.test.tsx
          src/lib/tests/tradingview-*.test.ts
          src/lib/tests/tradingview-*.test.tsx

      - name: Test recent trade rendering contracts
        working-directory: apps/terminal
        run: >-
          pnpm exec vitest run --maxWorkers=1
          src/lib/tests/number-format-reactivity-contract.test.ts
          src/lib/tests/responsive-panel-layout.test.ts
          src/lib/tests/trade-row.test.tsx
          src/lib/tests/trades-panel.test.tsx

      - name: Test Deposit, CCTP, routing, and geo guards
        working-directory: apps/terminal
        run: >-
          pnpm exec vitest run --maxWorkers=1
          src/lib/tests/cctp-deposit-catalogs.test.ts
          src/lib/tests/cctp-deposit-tracking.test.ts
          src/lib/tests/cctp-deposit.test.ts
          src/lib/tests/deposit-availability.test.tsx
          src/lib/tests/deposit-broadcast.test.ts
          src/lib/tests/deposit-empty-balances-entry.test.tsx
          src/lib/tests/deposit-execution-state.test.ts
          src/lib/tests/deposit-form-routing.test.tsx
          src/lib/tests/deposit-modal-withdrawal-routing-guard.test.tsx
          src/lib/tests/deposit-order-cta.test.tsx
          src/lib/tests/development-geo.test.ts
          src/lib/tests/embedded-deposit-auto-bridge.test.tsx
          src/lib/tests/funding-address-card.test.tsx
          src/lib/tests/geo-server-functions.test.ts
          src/lib/tests/referral-action-geo.test.ts
          src/lib/tests/trading-onboarding-gate.test.tsx
          src/lib/tests/usdc-routing.test.ts
          src/lib/tests/use-cctp-deposit-tracking.test.tsx
          src/lib/tests/use-deposit-routing-guard.test.tsx
          src/lib/tests/use-email-embedded-wallet.test.tsx
          src/lib/tests/use-geo-restriction.test.tsx
          src/lib/tests/use-usdc-routing.test.ts
          src/lib/tests/unit-deposit-info.test.tsx

      - name: Build production terminal and enforce bundle budget
        run: pnpm --filter @gatu/terminal build
        env:
          GATU_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
          GATU_RELEASE_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
          NODE_ENV: production
          NITRO_PRESET: node-server
          VITE_MOBILE_PAIRING_CREATE_ENABLED: ${{ matrix.pairing.create }}
          VITE_MOBILE_PAIRING_IMPORT_ENABLED: ${{ matrix.pairing.import }}

      - name: Verify actual mobile ticket HTTP protocol and process restart
        run: node deploy/mobile-sync-release.mjs attest apps/terminal/.output "${{ matrix.pairing.create }}" "${{ matrix.pairing.import }}"

      - name: Verify actual Nitro proxy aliases and same-artifact promotion
        run: |
          CADDY_BINARY="$RUNNER_TEMP/caddy" MOBILE_SYNC_OUTPUT=apps/terminal/.output node --test deploy/mobile-sync-caddy.test.mjs deploy/mobile-sync-candidate.test.mjs

      - name: Record verified mobile artifact identity
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { commit, release, mobileSync, verification, verifiedAt, sha256 } = JSON.parse(readFileSync('apps/terminal/.output/.gatu-mobile-sync.json', 'utf8'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, '```json\n' + JSON.stringify({ commit, release, mobileSync, verification, verifiedAt, sha256 }, null, 2) + '\n```\n');
          NODE

      - name: Measure client-root startup closure
        run: pnpm --filter @gatu/terminal perf:startup

      - name: Verify production lazy client graph
        run: |
          set -euo pipefail
          graph_tmp="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -rf "$graph_tmp"
          }
          trap cleanup EXIT

          HOST=127.0.0.1 PORT=3099 NODE_ENV=production \
            node --require=./deploy/referral-uri-guard.cjs apps/terminal/.output/server/index.mjs \
            >"$graph_tmp/server.log" 2>&1 &
          server_pid="$!"

          ready=false
          for _ in $(seq 1 30); do
            if curl --connect-timeout 2 --max-time 5 -fsS \
              -o "$graph_tmp/builders-perp.html" http://127.0.0.1:3099/builders-perp \
              2>"$graph_tmp/readiness-error"; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$graph_tmp/server.log"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$graph_tmp/readiness-error"
            cat "$graph_tmp/server.log"
            exit 1
          fi

          node deploy/resolve-client-asset.mjs \
            http://127.0.0.1:3099 "$graph_tmp/builders-perp.html" trade-terminal-page

      - name: Verify TradingView package and compressed build assets
        run: node deploy/verify-chart-build.mjs apps/terminal/public apps/terminal/.output/public deploy/manifests/tradingview-charting-library.json

  website:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for brand card verification
        run: pnpm exec playwright install --with-deps chromium

      - name: Test brand contracts
        run: pnpm test:brand

      - name: Build marketing website
        run: pnpm --filter @gatu/website build
