name: Production Builds

on:
  pull_request:
    paths:
      - ".github/workflows/production-build.yml"
      - "apps/**"
      - "brand/**"
      - "deploy/**"
      - "legal/**"
      - "packages/**"
      - "patches/**"
      - "scripts/check-client-bundle-budget.mjs"
      - "scripts/check-client-bundle-budget.test.mjs"
      - "scripts/inject-shell-preloads.mjs"
      - "scripts/inject-shell-preloads.test.mjs"
      - "scripts/collect-inline-script-hashes.mjs"
      - "scripts/collect-inline-script-hashes.test.mjs"
      - "scripts/serve-spa-static.mjs"
      - "scripts/serve-spa-static.test.mjs"
      - "scripts/check-client-chunk-cycles.mjs"
      - "scripts/client-chunk-graph.*"
      - "scripts/measure/analyze-client-root-deps.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  # Release tags and manual runs build both pairing states (see the build job's strategy).
  # The patterns require a digit after the prefix (`v0.1.0`, `cloudfront-2026-09-17-p21`), so an
  # `archive/**` tag or any other tag that merely starts with `v` never starts extra builds.
  # `tags` and `tags-ignore` cannot be combined, which is why the patterns themselves are narrow.
  push:
    tags:
      - "v[0-9]*"
      - "cloudfront-[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal:
    strategy:
      fail-fast: false
      matrix:
        # Pull requests build only the production default, with the pairing switch off.
        # Pull requests into main (the dev to main promotion), release tags and manual runs build
        # both states. A job-level `if` cannot do this because it cannot read `matrix`. The
        # lines of the expression share one indent so that YAML folds them into a single line.
        pairing: >-
          ${{ fromJSON(
          (github.event_name == 'pull_request' && github.base_ref != 'main')
          && '[{"enabled":"false"}]'
          || '[{"enabled":"false"},{"enabled":"true"}]'
          ) }}
    name: Build terminal (pairing ${{ matrix.pairing.enabled }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build production terminal and enforce bundle budget
        run: pnpm --filter @sairn/terminal build
        env:
          SAIRN_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SAIRN_RELEASE_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
          NODE_ENV: production
          NITRO_PRESET: node-server
          VITE_MOBILE_PAIRING_ENABLED: ${{ matrix.pairing.enabled }}

      - name: Measure client-root startup closure
        run: pnpm --filter @sairn/terminal perf:startup

      - name: Verify production lazy client graph
        run: |
          set -euo pipefail
          graph_tmp="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -rf "$graph_tmp"
          }
          trap cleanup EXIT

          HOST=127.0.0.1 PORT=3099 NODE_ENV=production \
            node --require=./deploy/referral-uri-guard.cjs apps/terminal/.output/server/index.mjs \
            >"$graph_tmp/server.log" 2>&1 &
          server_pid="$!"

          ready=false
          for _ in $(seq 1 30); do
            if curl --connect-timeout 2 --max-time 5 -fsS \
              -o "$graph_tmp/builders-perp.html" http://127.0.0.1:3099/builders-perp \
              2>"$graph_tmp/readiness-error"; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$graph_tmp/server.log"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$graph_tmp/readiness-error"
            cat "$graph_tmp/server.log"
            exit 1
          fi

          node deploy/resolve-client-asset.mjs \
            http://127.0.0.1:3099 "$graph_tmp/builders-perp.html" trade-terminal-page

      - name: Verify TradingView package and compressed build assets
        run: node deploy/verify-chart-build.mjs apps/terminal/public apps/terminal/.output/public deploy/manifests/tradingview-charting-library.json
