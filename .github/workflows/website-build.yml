name: Website and Brand

# `paths` can only filter a whole workflow, not one job, so the website job lives in its own
# workflow. The list covers every input of `pnpm test:brand` that is not a terminal unit test:
# the Terminal Tests workflow runs those for terminal changes.
on:
  pull_request:
    paths:
      - ".github/workflows/website-build.yml"
      - "apps/website/**"
      - "brand/**"
      - "legal/**"
      - "designs/og-cards/**"
      - "scripts/generate-og-cards.mjs"
      - "tests/**"
      - "apps/terminal/public/og-terminal-1200x630.png"
      - "apps/terminal/public/manifest.json"
      - "apps/terminal/public/robots.txt"
      - "apps/terminal/public/sitemap.xml"
      - "apps/terminal/src/config/**"
      - "apps/terminal/src/styles.css"
      - "packages/ui/src/globals.css"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A dev to main promotion skips the jobs below when the pull requests merged into dev already
  # passed this workflow on the tree being promoted, and runs them in full on any doubt (ADR 0016
  # D8). Every other event skips this job and runs the rest as before.
  coverage:
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev'
    name: Promotion coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      covered: ${{ steps.check.outputs.covered }}
    steps:
      # The script reads commits, trees and this workflow file but no other file contents, so a blobless
      # clone of the whole history is enough, and it needs nothing but git and the runner's own Node.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows

      - id: check
        run: node scripts/promotion-coverage.mjs website-build.yml
        env:
          GITHUB_TOKEN: ${{ github.token }}

  website:
    needs: coverage
    if: ${{ !cancelled() && needs.coverage.outputs.covered != 'true' }}
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for brand card verification
        run: pnpm exec playwright install --with-deps chromium

      - name: Test brand contracts
        run: pnpm test:brand

      - name: Build marketing website
        run: pnpm --filter @sairn/website build

      - name: Test built website
        run: pnpm --filter @sairn/website test:dist
