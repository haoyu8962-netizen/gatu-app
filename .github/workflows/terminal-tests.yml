name: Terminal Tests

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "apps/**"
      - "brand/**"
      - "deploy/**"
      - "legal/**"
      - "packages/**"
      - "patches/**"
      - "scripts/brand*.mjs"
      - "scripts/check-client-bundle-budget.mjs"
      - "scripts/check-client-bundle-budget.test.mjs"
      - "scripts/ci-workflows.test.mjs"
      - "scripts/inject-shell-preloads.mjs"
      - "scripts/inject-shell-preloads.test.mjs"
      - "scripts/collect-inline-script-hashes.mjs"
      - "scripts/collect-inline-script-hashes.test.mjs"
      - "scripts/serve-spa-static.mjs"
      - "scripts/serve-spa-static.test.mjs"
      - "scripts/client-chunk-graph.*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal-tests:
    # One Vitest step runs every file Vitest collects in apps/terminal, half of them per job
    # (Vitest shards by file); there is no hand-picked list, so a new test file runs without a
    # workflow change. Unit tests answer network requests locally and never reach a live
    # endpoint. The steps that are not Vitest run once, in the first shard.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: Test terminal and release tooling (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.15.0
          cache: pnpm

      - name: Check out the private chart library
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ github.repository_owner }}/gatu-chart-library
          token: ${{ secrets.CHART_LIBRARY_TOKEN }}
          path: .chart-library-src
          persist-credentials: false

      - name: Install and verify the chart library
        run: node scripts/fetch-chart-library.mjs --from .chart-library-src

      - run: pnpm install --frozen-lockfile

      - name: Test build and release validators
        if: matrix.shard == 1
        run: >-
          node --test
          scripts/check-client-bundle-budget.test.mjs
          scripts/ci-workflows.test.mjs
          scripts/fetch-chart-library.test.mjs
          scripts/inject-shell-preloads.test.mjs
          scripts/collect-inline-script-hashes.test.mjs
          scripts/serve-spa-static.test.mjs

      - name: Test the CloudFront release tooling
        if: matrix.shard == 1
        run: pnpm test:cloudfront

      - name: Check brand source consistency
        if: matrix.shard == 1
        run: pnpm brand:check

      - name: Test every terminal Vitest file
        working-directory: apps/terminal
        run: pnpm exec vitest run --maxWorkers=4 --shard=${{ matrix.shard }}/2
