name: Terminal Tests

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "apps/**"
      - "brand/**"
      - "deploy/**"
      - "legal/**"
      - "packages/**"
      - "patches/**"
      - "scripts/brand*.mjs"
      - "scripts/check-client-bundle-budget.mjs"
      - "scripts/check-client-bundle-budget.test.mjs"
      - "scripts/ci-workflows.test.mjs"
      - "scripts/inject-shell-preloads.mjs"
      - "scripts/inject-shell-preloads.test.mjs"
      - "scripts/collect-inline-script-hashes.mjs"
      - "scripts/collect-inline-script-hashes.test.mjs"
      - "scripts/serve-spa-static.mjs"
      - "scripts/serve-spa-static.test.mjs"
      - "scripts/client-chunk-graph.*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal-tests:
    # Every Vitest step below runs with `--shard`, so each job runs about half of each step's
    # files, still one worker at a time. Vitest shards by file, and a step whose files all land in
    # the other shard selects nothing here, hence `--passWithNoTests`; `ci-workflows.test.mjs`
    # checks that every listed path exists, so an empty selection is never a mistyped path. The
    # steps that are not Vitest run once, in the first shard.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: Test terminal and release tooling (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test build and release validators
        if: matrix.shard == 1
        run: >-
          node --test
          scripts/check-client-bundle-budget.test.mjs
          scripts/ci-workflows.test.mjs
          scripts/inject-shell-preloads.test.mjs
          scripts/collect-inline-script-hashes.test.mjs
          scripts/serve-spa-static.test.mjs

      - name: Test the CloudFront release tooling
        if: matrix.shard == 1
        run: pnpm test:cloudfront

      - name: Check brand source consistency
        if: matrix.shard == 1
        run: pnpm brand:check

      - name: Test Hyperliquid API resource hints
        working-directory: apps/terminal
        run: >-
          pnpm exec vitest run --maxWorkers=1 --shard=${{ matrix.shard }}/2 --passWithNoTests
          src/lib/tests/seo.test.ts
          src/lib/tests/hyperliquid-resource-hints.test.ts

      - name: Test terminal interaction and mounting contracts
        working-directory: apps/terminal
        run: >-
          pnpm exec vitest run --maxWorkers=1 --shard=${{ matrix.shard }}/2 --passWithNoTests
          src/lib/tests/user-menu.test.tsx
          src/lib/tests/top-nav.test.tsx
          src/lib/tests/desktop-nav-layout.test.ts
          src/lib/tests/mobile-nav-drawer.test.tsx
          src/lib/tests/mobile-nav-drawer-navigation.test.tsx
          src/lib/tests/earn-page-surface-contract.test.ts
          src/lib/tests/wallet-modal.test.tsx
          src/lib/tests/mobile-agent-sync-modal.test.tsx
          src/lib/tests/modal-surface-contract.test.ts
          src/lib/tests/dialog-notice-radius-contract.test.ts
          src/lib/tests/loading-placeholder-contract.test.ts
          src/lib/tests/funds-modal-scroll-contract.test.ts
          src/lib/tests/deposit-modal-warm.test.ts
          src/lib/tests/trades.test.ts
