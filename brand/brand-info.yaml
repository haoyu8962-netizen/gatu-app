# 品牌信息：把每一项改成新值；不变的项保留原值即可。
# 当前值来自仓库现状（2026-10-01），替换时代码、法律文本、robots/sitemap、部署配置都会以本文件为准。

name:
  display: "GATU"          # 页面标题、PWA 名称、分享卡上的品牌字样
  lowercase: "gatu"        # 文件名、下载的分享图文件名前缀
  # 注意：本地存储键、@gatu/* 包名、VITE_GATU_* 环境变量默认不改名，
  # 改了会清掉用户已保存的设置与登录状态；如确需改，请在这里写明。

domains:
  apex: "gatu.ai"                 # 官网主域名
  www: "www.gatu.ai"
  app: "app.gatu.ai"              # 主网交易终端
  testnet: "testnet.gatu.ai"      # 测试网交易终端
  preview: "preview.gatu.ai"      # 预览环境（如不再需要可写 null）

emails:
  support: "support@gatu.ai"      # 法律页、支持页、错误提示中出现
  hello: "hi@gatu.ai"             # 官网联系邮箱

social:                           # 官网与文档里的社交链接；没有就留空
  x: ""
  telegram: ""
  discord: ""

colors:
  # 品牌主色（荧光绿）：焦点环、品牌文字、加载动效的高亮段
  signal:
    light: "#667311"              # 浅色主题；作为文字使用时需对白底 ≥ 4.5:1
    dark: "#d7ff3f"               # 深色主题；需对 #0F1A1F 底 ≥ 4.5:1
  # 主按钮底色与按钮文字
  action:
    light: "#15171e"
    dark: "#edeef2"
  on_action:
    light: "#ffffff"
    dark: "#08090d"
  # Logo 两个可变色：主体（ink）和点缀节点（node）
  logo_ink:
    light: "#15171e"
    dark: "#edeef2"
  logo_node:
    light: "#15171e"
    dark: "#d7ff3f"
  # PWA 启动画面与浏览器地址栏颜色
  pwa_theme: "#0F1A1F"
  pwa_background: "#0F1A1F"
