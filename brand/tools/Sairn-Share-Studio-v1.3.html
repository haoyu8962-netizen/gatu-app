<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="Sairn 分享卡工作台：六种模板、四种画幅，导出 SVG 与 PNG。"><title>Sairn — Share Studio</title><style>/* Sairn Share Studio — editor UI. Colours map to tokens/sairn.tokens.json (light theme). */
.sairn-studio{--ink:#08262E;--muted:#536C70;--line:#DBE0D9;--line-strong:#C3CFCA;--bg:#F5F4EE;--surface:#FFFFFF;--surface-2:#FAFAF5;--raised:#E8EFEB;--accent:#176B64;--accent-soft:#E3EFEA;--amber:#99621F;--danger:#B3443C;--danger-soft:#FBEDEA;--focus:#176B64;--dark:#0A3038;
  --f11:11px;--f12:12px;--f13:13px;--f14:14px;--f16:16px;--r-sm:8px;--r:12px;--r-lg:16px;
  margin:0;background:var(--bg);color:var(--ink);font:400 var(--f14)/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.sairn-studio *,.sairn-studio *::before,.sairn-studio *::after{box-sizing:border-box}
.sairn-studio button,.sairn-studio input,.sairn-studio select,.sairn-studio textarea{font:inherit;color:inherit}
.sairn-studio button{cursor:pointer}
.sairn-studio button:disabled{cursor:not-allowed;opacity:.5}
.sairn-studio :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sairn-studio [hidden]{display:none!important}
.sairn-studio .ss-sr{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden;white-space:nowrap}
.sairn-studio :not(svg)>svg{display:block}
.sairn-studio .ss-main{max-width:1440px;margin:0 auto;padding:0 32px}
/* header */
.sairn-studio .ss-header{display:flex;align-items:center;gap:20px;height:72px;border-bottom:1px solid var(--line)}
.sairn-studio .ss-logo{display:block;line-height:0;color:inherit}
.sairn-studio .ss-logo>svg{display:block;height:28px;width:auto}
.sairn-studio .ss-breadcrumb{font-size:var(--f13);color:var(--muted);padding-left:20px;border-left:1px solid var(--line);line-height:24px}
.sairn-studio .ss-breadcrumb b{font-weight:500;color:var(--ink)}
.sairn-studio .ss-header-right{margin-left:auto;display:flex;align-items:center;gap:20px;font-size:var(--f13)}
.sairn-studio .ss-header-right a{color:var(--muted);text-decoration:none}
.sairn-studio .ss-header-right a:hover{color:var(--ink)}
.sairn-studio .ss-version{font-size:var(--f11);letter-spacing:.12em;color:var(--muted)}
/* intro */
.sairn-studio .ss-intro{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;padding:32px 0 24px}
.sairn-studio .ss-eyebrow{margin:0 0 12px;font-size:var(--f11);font-weight:500;letter-spacing:.16em;color:var(--muted)}
.sairn-studio h1{margin:0;font-size:40px;line-height:1.25;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sairn-studio h2{text-wrap:balance}
.sairn-studio p,.sairn-studio li,.sairn-studio small{text-wrap:pretty}
.sairn-studio h1 span{color:var(--accent)}
.sairn-studio .ss-intro-copy{margin:10px 0 0;font-size:var(--f14);color:var(--muted)}
.sairn-studio .ss-save{display:flex;align-items:center;gap:8px;font-size:var(--f12);color:var(--muted);white-space:nowrap}
.sairn-studio .ss-save i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.sairn-studio .ss-save.is-warn i{background:var(--amber)}
/* toolbar */
.sairn-studio .ss-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.sairn-studio .ss-segment{display:inline-flex;padding:3px;gap:2px;background:var(--raised);border-radius:10px}
.sairn-studio .ss-segment button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:8px;padding:6px 12px;font-size:var(--f13);color:var(--muted);white-space:nowrap;min-height:32px}
.sairn-studio .ss-segment button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px #08262E14}
.sairn-studio .ss-segment button small{font-size:var(--f11);color:var(--muted)}
.sairn-studio .ss-segment svg{width:16px;height:16px}
.sairn-studio .ss-toolbar-right{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.sairn-studio .ss-text-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:var(--r-sm);padding:8px 10px;font-size:var(--f13);color:var(--muted);min-height:36px}
.sairn-studio .ss-text-btn:hover{background:var(--raised);color:var(--ink)}
.sairn-studio .ss-text-btn svg{width:16px;height:16px}
.sairn-studio .ss-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:0 16px;height:40px;font-size:var(--f13);font-weight:600;border:1px solid transparent;white-space:nowrap}
.sairn-studio .ss-btn svg{width:16px;height:16px}
.sairn-studio .ss-btn-primary{background:var(--ink);color:#FFFFFF}
.sairn-studio .ss-btn-primary:hover:not(:disabled){background:#0F3A44}
.sairn-studio .ss-btn-outline{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.sairn-studio .ss-btn-outline:hover:not(:disabled){border-color:var(--ink)}
/* workspace */
.sairn-studio .ss-workspace{display:grid;grid-template-columns:216px minmax(0,1fr) 352px;height:min(960px,calc(100vh - 24px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:clip;min-height:760px}
.sairn-studio .ss-templates{border-right:1px solid var(--line);background:var(--surface-2);padding:20px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.sairn-studio .ss-label{font-size:var(--f11);font-weight:500;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.sairn-studio .ss-templates>.ss-label{padding:0 10px 12px}
.sairn-studio .ss-templates nav{display:flex;flex-direction:column;gap:4px}
.sairn-studio .ss-template{position:relative;display:flex;align-items:center;gap:10px;width:100%;border:1px solid transparent;background:transparent;border-radius:10px;padding:10px 18px 10px 10px;text-align:left;min-height:52px}
.sairn-studio .ss-template:hover{background:var(--raised)}
.sairn-studio .ss-template.active{background:var(--accent-soft);border-color:#CFE2DA}
.sairn-studio .ss-template-icon{flex:0 0 28px;height:28px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.sairn-studio .ss-template-icon svg{width:18px;height:18px}
.sairn-studio .ss-template.active .ss-template-icon{color:var(--accent)}
.sairn-studio .ss-template strong{display:block;font-size:var(--f13);font-weight:600;line-height:1.3}
.sairn-studio .ss-template small{display:block;font-size:var(--f11);color:var(--muted);line-height:1.4;margin-top:2px}
.sairn-studio .ss-template .ss-badge{display:inline-block;margin-left:6px;vertical-align:1px;padding:0 5px;border-radius:5px;background:var(--danger-soft);color:var(--danger);font-size:var(--f11);font-style:normal;font-weight:600;line-height:18px;white-space:nowrap}
.sairn-studio .ss-template .ss-badge.is-need{background:#F6ECDD;color:#7A4B12}
/* stage */
.sairn-studio .ss-stage{display:flex;flex-direction:column;min-width:0}
.sairn-studio .ss-stage-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sairn-studio .ss-stage-bar .ss-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sairn-studio .ss-canvas-area{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 24px;background:#EEF1EB;background-image:radial-gradient(#C3CFCA66 .8px,transparent .8px);background-size:12px 12px}
.sairn-studio .ss-canvas-top,.sairn-studio .ss-canvas-bottom{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:var(--f12);color:var(--muted);flex-wrap:wrap}
.sairn-studio .ss-check{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:var(--f12);color:var(--muted)}
.sairn-studio .ss-check input{width:15px;height:15px;accent-color:var(--accent);margin:0}
.sairn-studio .ss-canvas-wrap{position:relative;width:min(100%,500px);width:min(100%,500px,max(300px,calc((100svh - 240px) * 4 / 5)));margin:auto 0;box-shadow:0 10px 30px #08262E1F;line-height:0;border-radius:2px;overflow:hidden}
.sairn-studio .ss-canvas-wrap[data-format=square]{width:min(100%,560px);width:min(100%,560px,max(300px,calc(100svh - 240px)))}
.sairn-studio .ss-canvas-wrap[data-format=story]{width:min(100%,370px);width:min(100%,370px,max(240px,calc((100svh - 240px) * 9 / 16)))}
.sairn-studio .ss-canvas-wrap[data-format=landscape]{width:min(100%,720px)}
.sairn-studio .ss-card-host>svg{width:100%;height:auto}
.sairn-studio .ss-card-host{transition:opacity .15s}
.sairn-studio .is-stale .ss-card-host{opacity:.35}
.sairn-studio .ss-canvas-wrap.is-stale::after{content:'数据未通过校验 · 预览未更新';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:8px 14px;border-radius:8px;background:var(--danger);color:#FFFFFF;font-size:var(--f13);line-height:1.4;white-space:nowrap}
.sairn-studio .ss-guide{position:absolute;inset:0;pointer-events:none;display:none}
.sairn-studio .show-guides .ss-guide{display:block}
.sairn-studio .ss-guide>svg{width:100%;height:100%}
.sairn-studio .ss-status{display:inline-flex;align-items:center;gap:6px}
.sairn-studio .ss-status i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.sairn-studio .ss-status.is-error{color:var(--danger)}
.sairn-studio .ss-status.is-error i{background:var(--danger)}
.sairn-studio .ss-status.is-note i{background:var(--amber)}
.sairn-studio .ss-export-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);z-index:3}
.sairn-studio .ss-export-note{font-size:var(--f12);color:var(--muted)}
.sairn-studio .ss-export-note.is-error{color:var(--danger)}
.sairn-studio .ss-export-bar>div{display:flex;align-items:center;gap:8px;margin-left:auto}
.sairn-studio select.ss-select{height:40px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:0 10px;font-size:var(--f13)}
/* editor */
.sairn-studio .ss-editor{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:auto}
.sairn-studio .ss-editor-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 20px 4px;position:sticky;top:0;background:var(--surface);z-index:2}
.sairn-studio .ss-editor-head h2{margin:2px 0 0;font-size:20px;line-height:1.3}
.sairn-studio .ss-icon-btn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted)}
.sairn-studio .ss-icon-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.sairn-studio .ss-icon-btn svg{width:16px;height:16px}
.sairn-studio .ss-fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding:8px 20px 24px;min-width:0}
.sairn-studio .ss-caption{grid-column:1/-1;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:var(--f11);font-weight:500;letter-spacing:.12em;color:var(--muted)}
.sairn-studio .ss-caption:first-child{border-top:0;margin-top:0;padding-top:4px}
.sairn-studio .ss-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.sairn-studio .ss-full{grid-column:1/-1}
.sairn-studio .ss-field-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:var(--f12);color:var(--ink);font-weight:500}
.sairn-studio .ss-count{font-size:var(--f11);font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sairn-studio .ss-field input,.sairn-studio .ss-field select,.sairn-studio .ss-field textarea{width:100%;min-width:0;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);padding:8px 10px;font-size:var(--f13);line-height:1.6;transition:border-color .15s}
.sairn-studio .ss-field textarea{resize:vertical;min-height:64px}
.sairn-studio .ss-field input[type=number]{appearance:textfield;font-variant-numeric:tabular-nums}
.sairn-studio .ss-field input::-webkit-outer-spin-button,.sairn-studio .ss-field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sairn-studio .ss-field input:hover,.sairn-studio .ss-field select:hover,.sairn-studio .ss-field textarea:hover{border-color:#9FB3AD}
.sairn-studio .ss-field input:focus,.sairn-studio .ss-field select:focus,.sairn-studio .ss-field textarea:focus{border-color:var(--accent);outline:2px solid var(--focus);outline-offset:1px}
.sairn-studio .ss-field.is-error input,.sairn-studio .ss-field.is-error textarea,.sairn-studio .ss-field.is-error select{border-color:var(--danger)}
.sairn-studio .ss-msg{margin:0;font-size:var(--f12);line-height:1.5;color:var(--muted)}
.sairn-studio .ss-msg:empty{display:none}
.sairn-studio .ss-field.is-error .ss-msg{color:var(--danger)}
.sairn-studio .ss-note{grid-column:1/-1;margin:0;font-size:var(--f12);line-height:1.6;color:var(--muted)}
