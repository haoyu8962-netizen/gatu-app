<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" class="srm srm-copy-feedback" data-motion="copy-feedback" data-theme="on-light" data-paused="false" data-reduced="false" style="--srm-floor:0.78" color-interpolation="sRGB" focusable="false" role="img" aria-label="复制完成"><title>复制完成</title><style>.srm{overflow:visible}.srm .srm-anim{transform-box:fill-box;transform-origin:center}@keyframes srm13-breathe{0%,100%{opacity:1}50%{opacity:var(--srm-floor,.55)}}@keyframes srm13-seq{0%,25%,100%{opacity:var(--srm-floor,.55)}45%,70%{opacity:1}}@keyframes srm13-pop{from{opacity:.4;transform:scale(.72)}to{opacity:1;transform:none}}@keyframes srm13-fade{from{opacity:0}to{opacity:1}}.srm[data-paused="true"] .srm-anim,[data-motion-paused="true"] .srm .srm-anim{animation-play-state:paused!important}.srm[data-reduced="true"] .srm-anim,[data-motion-reduced="true"] .srm .srm-anim{animation:none!important}.srm[data-reduced="true"] .srm-progress-value,[data-motion-reduced="true"] .srm .srm-progress-value{transition:none!important}@media (prefers-reduced-motion:reduce){.srm .srm-anim{animation:none!important}.srm .srm-progress-value{transition:none!important}}.srm-copy-feedback .srm-check{stroke-dasharray:28;animation:srm13-draw-s 400ms cubic-bezier(.22,.7,.28,1) both}@keyframes srm13-draw-s{from{stroke-dashoffset:28}to{stroke-dashoffset:0}}</style><path class="srm-anim srm-check" d="M7 16.5 L13 22.5 L25.5 10" fill="none" stroke="#176B64" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>