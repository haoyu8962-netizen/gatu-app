<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" class="srm srm-cancelled" data-motion="cancelled" data-theme="on-light" data-paused="false" data-reduced="false" style="--srm-floor:0.78" color-interpolation="sRGB" focusable="false" role="img" aria-label="已取消"><title>已取消</title><style>.srm{overflow:visible}.srm .srm-anim{transform-box:fill-box;transform-origin:center}@keyframes srm13-breathe{0%,100%{opacity:1}50%{opacity:var(--srm-floor,.55)}}@keyframes srm13-seq{0%,25%,100%{opacity:var(--srm-floor,.55)}45%,70%{opacity:1}}@keyframes srm13-pop{from{opacity:.4;transform:scale(.72)}to{opacity:1;transform:none}}@keyframes srm13-fade{from{opacity:0}to{opacity:1}}.srm[data-paused="true"] .srm-anim,[data-motion-paused="true"] .srm .srm-anim{animation-play-state:paused!important}.srm[data-reduced="true"] .srm-anim,[data-motion-reduced="true"] .srm .srm-anim{animation:none!important}.srm[data-reduced="true"] .srm-progress-value,[data-motion-reduced="true"] .srm .srm-progress-value{transition:none!important}@media (prefers-reduced-motion:reduce){.srm .srm-anim{animation:none!important}.srm .srm-progress-value{transition:none!important}}.srm-cancelled .srm-token{animation:srm13-pop 400ms cubic-bezier(.22,.7,.28,1) both}.srm-cancelled .srm-glyph{animation:srm13-fade 267ms 133ms ease-out both}</style><g transform="translate(512 288) scale(.7) translate(-526 -499.5)"><g class="srm-mark"><path class="" data-part="signal" fill="#176B64" d="M290 204 C290 184 298 179 315 188 L490 282 C506 291 514 304 514 323 L514 601 C514 621 506 636 490 646 L315 745 C298 755 290 750 290 730 Z"/><path class="" data-part="choice" fill="#99621F" d="M740 317 C757 307 762 313 762 334 L762 792 C762 813 756 820 740 810 L602 725 C586 715 578 700 578 680 L578 444 C578 424 586 410 602 400 Z"/></g></g><circle class="srm-anim srm-token" cx="512" cy="752" r="196" fill="#536C70"/><rect class="srm-anim srm-glyph" x="446" y="686" width="132" height="132" rx="24" fill="#FFFFFF"/></svg>