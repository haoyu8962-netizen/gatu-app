<svg xmlns="http://www.w3.org/2000/svg" width="640" height="32" viewBox="0 0 640 32" class="srm srm-progress" data-motion="progress" data-theme="mono" data-paused="false" data-reduced="false" style="--srm-floor:0.78" color-interpolation="sRGB" focusable="false" role="progressbar" aria-label="真实进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><title>真实进度</title><style>.srm{overflow:visible}.srm .srm-anim{transform-box:fill-box;transform-origin:center}@keyframes srm13-breathe{0%,100%{opacity:1}50%{opacity:var(--srm-floor,.55)}}@keyframes srm13-seq{0%,25%,100%{opacity:var(--srm-floor,.55)}45%,70%{opacity:1}}@keyframes srm13-pop{from{opacity:.4;transform:scale(.72)}to{opacity:1;transform:none}}@keyframes srm13-fade{from{opacity:0}to{opacity:1}}.srm[data-paused="true"] .srm-anim,[data-motion-paused="true"] .srm .srm-anim{animation-play-state:paused!important}.srm[data-reduced="true"] .srm-anim,[data-motion-reduced="true"] .srm .srm-anim{animation:none!important}.srm[data-reduced="true"] .srm-progress-value,[data-motion-reduced="true"] .srm .srm-progress-value{transition:none!important}@media (prefers-reduced-motion:reduce){.srm .srm-anim{animation:none!important}.srm .srm-progress-value{transition:none!important}}.srm-progress .srm-progress-value{transition:width 180ms ease-out}</style><rect x="0" y="8" width="640" height="16" rx="8" fill="currentColor" opacity="0.3"/><rect class="srm-progress-value" data-progress-value="true" x="0" y="8" width="0" height="16" rx="8" fill="currentColor"/></svg>