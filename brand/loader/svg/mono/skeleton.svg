<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" class="srm srm-skeleton" data-motion="skeleton" data-theme="mono" data-paused="false" data-reduced="false" style="--srm-floor:0.78" color-interpolation="sRGB" focusable="false" role="img" aria-label="内容骨架"><title>内容骨架</title><style>.srm{overflow:visible}.srm .srm-anim{transform-box:fill-box;transform-origin:center}@keyframes srm13-breathe{0%,100%{opacity:1}50%{opacity:var(--srm-floor,.55)}}@keyframes srm13-seq{0%,25%,100%{opacity:var(--srm-floor,.55)}45%,70%{opacity:1}}@keyframes srm13-pop{from{opacity:.4;transform:scale(.72)}to{opacity:1;transform:none}}@keyframes srm13-fade{from{opacity:0}to{opacity:1}}.srm[data-paused="true"] .srm-anim,[data-motion-paused="true"] .srm .srm-anim{animation-play-state:paused!important}.srm[data-reduced="true"] .srm-anim,[data-motion-reduced="true"] .srm .srm-anim{animation:none!important}.srm[data-reduced="true"] .srm-progress-value,[data-motion-reduced="true"] .srm .srm-progress-value{transition:none!important}@media (prefers-reduced-motion:reduce){.srm .srm-anim{animation:none!important}.srm .srm-progress-value{transition:none!important}}.srm-skeleton .srm-block{animation:srm13-skel 2000ms ease-in-out infinite}.srm-skeleton .srm-late{animation-delay:-600ms}@keyframes srm13-skel{0%,100%{opacity:.16}50%{opacity:.32}}</style><rect x="0" y="8" width="72" height="16" rx="8" fill="currentColor" opacity=".5"/><rect class="srm-anim srm-block" x="0" y="52" width="270" height="30" rx="8" fill="currentColor" opacity=".24"/><rect class="srm-anim srm-block srm-late" x="0" y="106" width="580" height="16" rx="8" fill="currentColor" opacity=".24"/><rect class="srm-anim srm-block" x="0" y="136" width="454" height="16" rx="8" fill="currentColor" opacity=".24"/><rect class="srm-anim srm-block srm-late" x="0" y="198" width="188" height="106" rx="12" fill="currentColor" opacity=".24"/><rect class="srm-anim srm-block srm-late" x="210" y="198" width="188" height="106" rx="12" fill="currentColor" opacity=".24"/><rect class="srm-anim srm-block srm-late" x="420" y="198" width="188" height="106" rx="12" fill="currentColor" opacity=".24"/></svg>