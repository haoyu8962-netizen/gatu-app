<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="srm srm-g-success" data-motion="glyph-success" data-theme="on-light" data-paused="false" data-reduced="false" style="--srm-floor:0.78" color-interpolation="sRGB" focusable="false" role="img" aria-label="已确认"><title>已确认</title><style>.srm{overflow:visible}.srm .srm-anim{transform-box:fill-box;transform-origin:center}@keyframes srm13-breathe{0%,100%{opacity:1}50%{opacity:var(--srm-floor,.55)}}@keyframes srm13-seq{0%,25%,100%{opacity:var(--srm-floor,.55)}45%,70%{opacity:1}}@keyframes srm13-pop{from{opacity:.4;transform:scale(.72)}to{opacity:1;transform:none}}@keyframes srm13-fade{from{opacity:0}to{opacity:1}}.srm[data-paused="true"] .srm-anim,[data-motion-paused="true"] .srm .srm-anim{animation-play-state:paused!important}.srm[data-reduced="true"] .srm-anim,[data-motion-reduced="true"] .srm .srm-anim{animation:none!important}.srm[data-reduced="true"] .srm-progress-value,[data-motion-reduced="true"] .srm .srm-progress-value{transition:none!important}@media (prefers-reduced-motion:reduce){.srm .srm-anim{animation:none!important}.srm .srm-progress-value{transition:none!important}}.srm-g-success .srm-gcheck{stroke-dasharray:1;animation:srm13-gdraw 560ms cubic-bezier(.22,.7,.28,1) both}@keyframes srm13-gdraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}</style><circle cx="12" cy="12" r="10" fill="#176B64"/><path class="srm-anim srm-gcheck" pathLength="1" d="M7.6 12.3 L10.6 15.3 L16.4 9.3" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>