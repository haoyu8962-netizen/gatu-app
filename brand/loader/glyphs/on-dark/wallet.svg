<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="srm srm-g-wallet" data-motion="glyph-wallet" data-theme="on-dark" data-paused="false" data-reduced="false" style="--srm-floor:0.55" color-interpolation="sRGB" focusable="false" role="img" aria-label="等待钱包确认"><title>等待钱包确认</title><style>.srm{overflow:visible}.srm .srm-anim{transform-box:fill-box;transform-origin:center}@keyframes srm13-breathe{0%,100%{opacity:1}50%{opacity:var(--srm-floor,.55)}}@keyframes srm13-seq{0%,25%,100%{opacity:var(--srm-floor,.55)}45%,70%{opacity:1}}@keyframes srm13-pop{from{opacity:.4;transform:scale(.72)}to{opacity:1;transform:none}}@keyframes srm13-fade{from{opacity:0}to{opacity:1}}.srm[data-paused="true"] .srm-anim,[data-motion-paused="true"] .srm .srm-anim{animation-play-state:paused!important}.srm[data-reduced="true"] .srm-anim,[data-motion-reduced="true"] .srm .srm-anim{animation:none!important}.srm[data-reduced="true"] .srm-progress-value,[data-motion-reduced="true"] .srm .srm-progress-value{transition:none!important}@media (prefers-reduced-motion:reduce){.srm .srm-anim{animation:none!important}.srm .srm-progress-value{transition:none!important}}.srm-g-wallet .srm-gp{animation:srm13-breathe 2800ms ease-in-out infinite}</style><circle cx="12" cy="12" r="9.1" fill="none" stroke="#E6B766" stroke-width="1.8"/><rect class="srm-anim srm-gp" x="9.1" y="8.4" width="2.1" height="7.2" rx=".9" fill="#E6B766"/><rect class="srm-anim srm-gp" x="12.8" y="8.4" width="2.1" height="7.2" rx=".9" fill="#E6B766"/></svg>