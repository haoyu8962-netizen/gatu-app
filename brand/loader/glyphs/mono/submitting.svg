<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="srm srm-g-submitting" data-motion="glyph-submitting" data-theme="mono" data-paused="false" data-reduced="false" style="--srm-floor:0.78" color-interpolation="sRGB" focusable="false" role="img" aria-label="正在提交"><title>正在提交</title><style>.srm{overflow:visible}.srm .srm-anim{transform-box:fill-box;transform-origin:center}@keyframes srm13-breathe{0%,100%{opacity:1}50%{opacity:var(--srm-floor,.55)}}@keyframes srm13-seq{0%,25%,100%{opacity:var(--srm-floor,.55)}45%,70%{opacity:1}}@keyframes srm13-pop{from{opacity:.4;transform:scale(.72)}to{opacity:1;transform:none}}@keyframes srm13-fade{from{opacity:0}to{opacity:1}}.srm[data-paused="true"] .srm-anim,[data-motion-paused="true"] .srm .srm-anim{animation-play-state:paused!important}.srm[data-reduced="true"] .srm-anim,[data-motion-reduced="true"] .srm .srm-anim{animation:none!important}.srm[data-reduced="true"] .srm-progress-value,[data-motion-reduced="true"] .srm .srm-progress-value{transition:none!important}@media (prefers-reduced-motion:reduce){.srm .srm-anim{animation:none!important}.srm .srm-progress-value{transition:none!important}}.srm-g-submitting .srm-ga{animation:srm13-gsend 1400ms ease-in-out infinite}@keyframes srm13-gsend{0%{opacity:var(--srm-floor,.55);transform:translateX(-1px)}55%,70%{opacity:1;transform:translateX(1px)}100%{opacity:var(--srm-floor,.55);transform:translateX(1px)}}</style><circle cx="12" cy="12" r="9.1" fill="none" stroke="currentColor" stroke-width="1.8"/><path class="srm-anim srm-ga" d="M7.8 12 H15.4 M12.8 9.2 L15.6 12 L12.8 14.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>