<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="srm srm-g-pending" data-motion="glyph-pending" data-theme="mono" data-paused="false" data-reduced="false" style="--srm-floor:0.78" color-interpolation="sRGB" focusable="false" role="img" aria-label="等待结果"><title>等待结果</title><style>.srm{overflow:visible}.srm .srm-anim{transform-box:fill-box;transform-origin:center}@keyframes srm13-breathe{0%,100%{opacity:1}50%{opacity:var(--srm-floor,.55)}}@keyframes srm13-seq{0%,25%,100%{opacity:var(--srm-floor,.55)}45%,70%{opacity:1}}@keyframes srm13-pop{from{opacity:.4;transform:scale(.72)}to{opacity:1;transform:none}}@keyframes srm13-fade{from{opacity:0}to{opacity:1}}.srm[data-paused="true"] .srm-anim,[data-motion-paused="true"] .srm .srm-anim{animation-play-state:paused!important}.srm[data-reduced="true"] .srm-anim,[data-motion-reduced="true"] .srm .srm-anim{animation:none!important}.srm[data-reduced="true"] .srm-progress-value,[data-motion-reduced="true"] .srm .srm-progress-value{transition:none!important}@media (prefers-reduced-motion:reduce){.srm .srm-anim{animation:none!important}.srm .srm-progress-value{transition:none!important}}.srm-g-pending .srm-gd{animation:srm13-seq 2000ms ease-in-out infinite}.srm-g-pending .srm-gd1{animation-delay:-1333ms}.srm-g-pending .srm-gd2{animation-delay:-667ms}</style><circle cx="12" cy="12" r="9.1" fill="none" stroke="currentColor" stroke-width="1.8"/><circle class="srm-anim srm-gd srm-gd0" cx="7.6" cy="12" r="1.75" fill="currentColor"/><circle class="srm-anim srm-gd srm-gd1" cx="12" cy="12" r="1.75" fill="currentColor"/><circle class="srm-anim srm-gd srm-gd2" cx="16.4" cy="12" r="1.75" fill="currentColor"/></svg>