<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Sairn OG cards</title>
		<style>
			@font-face {
				font-family: "OG Barlow";
				font-style: normal;
				font-weight: 400;
				font-display: block;
				src: url("./fonts/barlow-regular-latin.woff2") format("woff2");
			}

			@font-face {
				font-family: "OG Barlow Condensed";
				font-style: normal;
				font-weight: 400;
				font-display: block;
				src: url("./fonts/barlow-condensed-regular-latin.woff2") format("woff2");
			}

			@font-face {
				font-family: "OG Barlow Condensed";
				font-style: normal;
				font-weight: 600;
				font-display: block;
				src: url("./fonts/barlow-condensed-semibold-latin.woff2") format("woff2");
			}

			@font-face {
				font-family: "OG Noto Sans SC";
				font-style: normal;
				font-weight: 400;
				font-display: block;
				src: url("./fonts/noto-sans-sc-regular-og-subset.woff2") format("woff2");
			}

			/* Sairn tokens v1.3, dark theme (brand/tokens/sairn.tokens.json). */
			:root {
				--surface: #0a3038;
				--surface-top: #0c353d;
				--surface-bottom: #061f27;
				--border: #2b5055;
				--text: #f4f8f4;
				--text-muted: #a5bfbc;
				--signal: #86e5d3;
				--choice: #e6b766;
				background: var(--surface);
				color: var(--text);
				font-family: "OG Barlow", sans-serif;
				font-size: 15px;
				line-height: 1.55;
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				width: 1200px;
				height: 630px;
				margin: 0;
				overflow: hidden;
			}

			.card {
				position: relative;
				display: none;
				width: 1200px;
				height: 630px;
				overflow: hidden;
				background: linear-gradient(180deg, var(--surface-top), var(--surface) 55%, var(--surface-bottom));
			}

			html[data-card="terminal"] .card--terminal,
			html[data-card="website"] .card--website {
				display: flex;
			}

			.signal-line {
				display: flex;
				width: 64px;
				height: 5px;
				flex: none;
			}

			.signal-line::before,
			.signal-line::after {
				content: "";
				display: block;
				height: 100%;
			}

			.signal-line::before {
				width: 62%;
				background: var(--signal);
			}

			.signal-line::after {
				width: 38%;
				background: var(--choice);
			}

			.bottom-signal {
				position: absolute;
				right: 0;
				bottom: 0;
				left: 0;
				display: flex;
				height: 6px;
			}

			.bottom-signal::before,
			.bottom-signal::after {
				content: "";
				display: block;
				height: 100%;
			}

			.bottom-signal::before {
				flex: 62;
				background: var(--signal);
			}

			.bottom-signal::after {
				flex: 38;
				background: var(--choice);
			}

			.card--terminal {
				flex-direction: column;
				justify-content: center;
				gap: 34px;
				padding: 96px;
			}

			.terminal-watermark {
				position: absolute;
				top: 40px;
				right: 72px;
				height: 550px;
				opacity: 0.07;
			}

			.terminal-lockup {
				height: 120px;
				flex: none;
				align-self: flex-start;
			}

			.terminal-description {
				color: var(--text-muted);
				font-family: "OG Noto Sans SC", sans-serif;
				font-size: 34px;
				line-height: 1.4;
				letter-spacing: 0.12em;
			}

			.terminal-footer {
				display: flex;
				align-items: center;
				gap: 20px;
				font-family: "OG Barlow Condensed", sans-serif;
				font-size: 22px;
				letter-spacing: 0.18em;
			}

			.terminal-footer__url {
				color: var(--signal);
			}

			.terminal-footer__divider {
				width: 1px;
				height: 20px;
				background: var(--border);
			}

			.terminal-footer__description {
				color: var(--text-muted);
				font-family: "OG Noto Sans SC", sans-serif;
				font-size: 22px;
				letter-spacing: 0.12em;
			}

			.card--website {
				flex-direction: column;
				justify-content: space-between;
				padding: 84px 96px 78px;
			}

			.website-grid {
				position: absolute;
				inset: 0;
				display: grid;
				grid-template-columns: repeat(12, 1fr);
				opacity: 0.45;
			}

			.website-grid span:not(:last-child) {
				border-right: 1px solid #0f3a42;
			}

			.website-copy {
				z-index: 1;
				display: flex;
				flex-direction: column;
				gap: 30px;
			}

			.website-title {
				max-width: 980px;
				margin: 0;
				font-family: "OG Barlow Condensed", sans-serif;
				font-size: 88px;
				font-weight: 600;
				line-height: 1.02;
				letter-spacing: 0.01em;
			}

			.website-title__signal {
				display: block;
				color: var(--signal);
			}

			.website-title__choice {
				display: block;
				color: var(--choice);
			}

			.website-description {
				max-width: 820px;
				margin: 0;
				color: var(--text-muted);
				font-size: 25px;
				line-height: 1.5;
			}

			.website-footer {
				z-index: 1;
				display: flex;
				align-items: center;
				gap: 18px;
				padding-top: 30px;
				border-top: 1px solid var(--border);
			}

			.website-footer__lockup {
				height: 40px;
			}

			.website-footer__divider {
				width: 1px;
				height: 26px;
				background: var(--border);
			}

			.website-footer__url {
				color: var(--signal);
				font-family: "OG Barlow Condensed", sans-serif;
				font-size: 21px;
				letter-spacing: 0.18em;
			}

			.website-footer__features {
				margin-left: auto;
				color: var(--text-muted);
				font-family: "OG Barlow Condensed", sans-serif;
				font-size: 18px;
				letter-spacing: 0.12em;
			}
		</style>
		<script>
			const card = new URLSearchParams(window.location.search).get("card");
			if (card === "terminal" || card === "website") {
				document.documentElement.dataset.card = card;
			}
		</script>
	</head>
