<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>GATU OG cards</title>
		<style>
			@font-face {
				font-family: "GATU Barlow";
				font-style: normal;
				font-weight: 400;
				font-display: block;
				src: url("./fonts/barlow-regular-latin.woff2") format("woff2");
			}

			@font-face {
				font-family: "GATU Barlow Condensed";
				font-style: normal;
				font-weight: 400;
				font-display: block;
				src: url("./fonts/barlow-condensed-regular-latin.woff2") format("woff2");
			}

			@font-face {
				font-family: "GATU Barlow Condensed";
				font-style: normal;
				font-weight: 600;
				font-display: block;
				src: url("./fonts/barlow-condensed-semibold-latin.woff2") format("woff2");
			}

			@font-face {
				font-family: "GATU Noto Sans SC";
				font-style: normal;
				font-weight: 400;
				font-display: block;
				src: url("./fonts/noto-sans-sc-regular-gatu-subset.woff2") format("woff2");
			}

			:root {
				background: #08090d;
				color: #edeef2;
				font-family: "GATU Barlow", sans-serif;
				font-size: 15px;
				line-height: 1.55;
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				width: 1200px;
				height: 630px;
				margin: 0;
				overflow: hidden;
			}

			.card {
				position: relative;
				display: none;
				width: 1200px;
				height: 630px;
				overflow: hidden;
				background: #08090d;
			}

			html[data-card="terminal"] .card--terminal,
			html[data-card="website"] .card--website {
				display: flex;
			}

			.signal-line {
				display: block;
				width: 52px;
				height: 5px;
				flex: none;
				background: #d7ff3f;
			}

			.bottom-signal {
				position: absolute;
				right: 0;
				bottom: 0;
				left: 0;
				height: 6px;
				background: #d7ff3f;
			}

			.card--terminal {
				flex-direction: column;
				justify-content: center;
				gap: 30px;
				padding: 96px;
			}

			.terminal-watermark {
				position: absolute;
				top: 35px;
				right: 38px;
				width: 560px;
				height: 560px;
				color: #edeef2;
				opacity: 0.045;
			}

			.terminal-lockup {
				display: flex;
				align-items: center;
				gap: 30px;
			}

			.terminal-lockup__mark {
				width: 132px;
				height: 132px;
				flex: none;
				color: #edeef2;
			}

			.terminal-lockup__copy {
				display: flex;
				flex-direction: column;
				gap: 12px;
			}

			.terminal-lockup__name {
				font-family: "GATU Barlow Condensed", sans-serif;
				font-size: 96px;
				font-weight: 600;
				line-height: 0.9;
				letter-spacing: 0.18em;
			}

			.terminal-lockup__description {
				height: 41.85px;
				color: #9ea1ab;
				font-family: "GATU Barlow Condensed", sans-serif;
				font-size: 27px;
				font-weight: 400;
				line-height: 1.55;
				letter-spacing: 0.2em;
			}

			.terminal-footer {
				display: flex;
				align-items: center;
				gap: 20px;
				font-family: "GATU Barlow Condensed", sans-serif;
				font-size: 21px;
				letter-spacing: 0.18em;
			}

			.terminal-footer__url {
				color: #d7ff3f;
			}

			.terminal-footer__divider {
				width: 1px;
				height: 20px;
				background: #262a35;
			}

			.terminal-footer__description {
				height: 32.55px;
				color: #9ea1ab;
				font-family: "GATU Barlow Condensed", sans-serif;
				font-size: 21px;
				letter-spacing: 0.18em;
			}

			.terminal-copy-cjk {
				font-family: "GATU Noto Sans SC", sans-serif;
			}

			.card--website {
				flex-direction: column;
				justify-content: space-between;
				padding: 84px 96px 78px;
			}

			.website-grid {
				position: absolute;
				inset: 0;
				display: grid;
				grid-template-columns: repeat(12, 1fr);
				opacity: 0.5;
			}

			.website-grid span:not(:last-child) {
				border-right: 1px solid #12141a;
			}

			.website-copy {
				z-index: 1;
				display: flex;
				flex-direction: column;
				gap: 30px;
			}

			.website-title {
				max-width: 920px;
				margin: 0;
				color: #edeef2;
				font-family: "GATU Barlow Condensed", sans-serif;
				font-size: 86px;
				font-weight: 600;
				line-height: 1.02;
				letter-spacing: 0.01em;
			}

			.website-title__signal {
				color: #d7ff3f;
			}

			.website-description {
				max-width: 800px;
				margin: 0;
				color: #9ea1ab;
				font-size: 25px;
				line-height: 1.5;
			}

			.website-footer {
				z-index: 1;
				display: flex;
				align-items: center;
				gap: 18px;
				padding-top: 30px;
				border-top: 1px solid #262a35;
			}

			.website-footer__mark {
				width: 44px;
				height: 44px;
				color: #edeef2;
			}

			.website-footer__name {
				font-family: "GATU Barlow Condensed", sans-serif;
				font-size: 34px;
				font-weight: 600;
				letter-spacing: 0.2em;
			}

			.website-footer__divider {
				width: 1px;
				height: 26px;
				background: #262a35;
			}

			.website-footer__url {
				color: #d7ff3f;
				font-family: "GATU Barlow Condensed", sans-serif;
				font-size: 21px;
				letter-spacing: 0.18em;
			}

			.website-footer__features {
				margin-left: auto;
				color: #9ea1ab;
				font-family: "GATU Barlow Condensed", sans-serif;
				font-size: 18px;
				letter-spacing: 0.12em;
			}
		</style>
		<script>
			const card = new URLSearchParams(window.location.search).get("card");
			if (card === "terminal" || card === "website") {
				document.documentElement.dataset.card = card;
			}
		</script>
	</head>
	<body>
		<main>
			<section
				class="card card--terminal"
				data-og-card="terminal"
				aria-label="GATU Terminal OG card"
				lang="zh-CN"
			>
				<svg class="terminal-watermark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
					<path d="M42.5 8 H8 V40 H40 V24 H26" stroke="currentColor" stroke-width="5" />
					<rect x="18" y="20" width="8" height="8" fill="#d7ff3f" opacity="0.5" />
				</svg>
				<span class="signal-line"></span>
				<div class="terminal-lockup">
					<svg class="terminal-lockup__mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
						<path d="M42.5 8 H8 V40 H40 V24 H26" stroke="currentColor" stroke-width="5" />
						<rect x="18" y="20" width="8" height="8" fill="#d7ff3f" />
					</svg>
					<div class="terminal-lockup__copy">
						<span class="terminal-lockup__name">GATU</span>
						<span class="terminal-lockup__description"
							><span class="terminal-copy-cjk">永续</span> · <span class="terminal-copy-cjk">现货交易终端</span></span
						>
					</div>
				</div>
				<div class="terminal-footer">
					<span class="terminal-footer__url">GATU.AI</span>
					<span class="terminal-footer__divider"></span>
					<span class="terminal-footer__description"
						><span class="terminal-copy-cjk">低延迟</span> · <span class="terminal-copy-cjk">自托管</span> ·
						<span class="terminal-copy-cjk">链上结算</span></span
					>
				</div>
				<span class="bottom-signal"></span>
			</section>

			<section class="card card--website" data-og-card="website" aria-label="GATU Website OG card">
				<div class="website-grid" aria-hidden="true">
					<span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span
					><span></span><span></span><span></span><span></span>
				</div>
				<div class="website-copy">
					<span class="signal-line"></span>
					<h1 class="website-title"><span class="website-title__signal">Gateway</span> to on-chain transactions</h1>
					<p class="website-description">Perpetual and spot trading—direct on-chain access via a single gateway.</p>
				</div>
				<div class="website-footer">
					<svg class="website-footer__mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
						<path d="M42.5 8 H8 V40 H40 V24 H26" stroke="currentColor" stroke-width="5" />
						<rect x="18" y="20" width="8" height="8" fill="#d7ff3f" />
					</svg>
					<span class="website-footer__name">GATU</span>
					<span class="website-footer__divider"></span>
					<span class="website-footer__url">GATU.AI</span>
					<span class="website-footer__features">PERPETUALS · SPOT · SELF-CUSTODY</span>
				</div>
				<span class="bottom-signal"></span>
			</section>
		</main>
	</body>
</html>
